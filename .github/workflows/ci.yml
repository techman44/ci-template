name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      go: ${{ steps.detect.outputs.go }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          {
            if [ -f package.json ]; then echo "node=true"; else echo "node=false"; fi
            if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then echo "python=true"; else echo "python=false"; fi
            if [ -f go.mod ]; then echo "go=true"; else echo "go=false"; fi
            if [ -f Dockerfile ]; then echo "docker=true"; else echo "docker=false"; fi
          } >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Node ----------
      - if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - if: needs.detect.outputs.node == 'true'
        name: Node — install, lint, test, build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      # ---------- Python ----------
      - if: needs.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: needs.detect.outputs.python == 'true'
        name: Python — install, lint, test
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest
          # advisory for now — delete '|| true' to make lint blocking
          ruff check . || true
          if compgen -G "tests/*" > /dev/null || compgen -G "test_*.py" > /dev/null; then
            pytest
          else
            echo "no tests found"
          fi

      # ---------- Go ----------
      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: needs.detect.outputs.go == 'true'
        name: Go — vet + test
        run: |
          go vet ./...
          go test ./...

      - if: needs.detect.outputs.node != 'true' && needs.detect.outputs.python != 'true' && needs.detect.outputs.go != 'true'
        run: echo "No recognized project type yet — CI passes vacuously. Add your build/test steps to .github/workflows/ci.yml."

  # Builds on every PR; pushes to ghcr.io only on push to main or a v* tag.
  docker:
    needs: [detect, test]
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
