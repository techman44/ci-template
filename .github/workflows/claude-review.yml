name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clear previous Claude verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --remove-label "ai:claude-approved" --remove-label "ai:claude-changes-requested" || true

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # On a Claude subscription instead of API billing? Run `claude setup-token`
          # locally, save the result as the CLAUDE_CODE_OAUTH_TOKEN secret, then swap
          # the line above for:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request like a staff engineer:
            - correctness bugs and unhandled edge cases
            - security issues
            - performance problems
            - serious maintainability concerns

            The PR branch is already checked out in the working directory.
            Use `gh pr comment` for overall feedback and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for line-specific issues. Only post feedback as GitHub comments.

            Then deliver your verdict by labelling the PR:
            - No blocking issues:
              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "ai:claude-approved"
            - Blocking issues found:
              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "ai:claude-changes-requested"

            Style nitpicks and preferences are NOT blocking — mention them but still approve.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*)"

  gate:
    needs: review
    uses: ./.github/workflows/ai-gate.yml
    permissions:
      contents: write
      pull-requests: write
